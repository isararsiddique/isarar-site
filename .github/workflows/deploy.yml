name: Deploy isarar.com

# Push to main and the site goes live.
#
# Optional repository secrets:
#   CF_API_TOKEN   Workers KV Storage:Edit + Cache Purge:Purge
#   CF_ACCOUNT_ID  Cloudflare account id
#
# With both set, this pins the Worker to the exact commit and purges the edge,
# so the change is live immediately and can be cached hard. Without them the
# Worker tracks the main branch and picks the change up within about a minute,
# so the site still updates and this workflow still passes.
#
# Note: the secrets context is not available inside an `if:` expression, so the
# secrets are mapped into job level env first and the conditions test env.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-isarar
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      KV_NAMESPACE_ID: 49e602c2752042328f7b041d3e641a1d
      CF_ZONE_ID: eb390dfb9df18aa4c13203646778d7a7

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate sitemap, feed, llms.txt and JSON endpoints
        run: python3 build.py

      - name: Validate before publishing
        run: |
          python3 - <<'PY'
          import glob, json, re, sys
          import xml.dom.minidom as minidom
          bad = 0
          for f in ['sitemap.xml', 'feed.xml']:
              minidom.parse(f)
              print('ok xml', f)
          for f in glob.glob('api/*.json') + ['.well-known/agent.json', 'posts.json']:
              json.load(open(f))
              print('ok json', f)
          for f in sorted(glob.glob('**/*.html', recursive=True)):
              s = open(f, encoding='utf-8').read()
              for b in re.findall(r'<script type="application/ld\+json">(.*?)</script>', s, re.S):
                  try:
                      json.loads(b)
                  except json.JSONDecodeError as e:
                      print('FAIL invalid JSON-LD in', f, e); bad = 1
              if '\u2014' in s or '\u2013' in s:
                  print('FAIL em or en dash in', f); bad = 1
          print('validation', 'failed' if bad else 'passed')
          sys.exit(bad)
          PY

      - name: Commit regenerated files if they changed
        id: regen
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: regenerate metadata [skip ci]"
            git push
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "regenerated and pushed $(git rev-parse --short HEAD)"
          else
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "nothing to regenerate, using ${GITHUB_SHA}"
          fi

      - name: Pin the Worker to this commit
        if: env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        run: |
          curl -sS --fail-with-body -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${KV_NAMESPACE_ID}/values/current_sha" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -F "value=${{ steps.regen.outputs.sha }}" \
            -F 'metadata={}' | head -c 200
          echo

      - name: Purge the edge cache
        if: env.CF_API_TOKEN != ''
        run: |
          curl -sS --fail-with-body -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | head -c 200
          echo

      - name: Note when running without a Cloudflare token
        if: env.CF_API_TOKEN == ''
        run: |
          echo "CF_API_TOKEN is not set."
          echo "The Worker tracks the main branch, so this change goes live within"
          echo "about a minute with no further action. Add CF_API_TOKEN scoped to"
          echo "Workers KV Storage:Edit and Cache Purge:Purge to make it instant."

      - name: Confirm it is live
        run: |
          if [ -n "${CF_API_TOKEN}" ]; then sleep 15; else sleep 80; fi

          # Check every post and every card, not a hardcoded sample. A new post
          # that never propagated would otherwise pass unnoticed.
          python3 - <<'PY' > /tmp/paths.txt
          import json
          paths = ['/', '/blog/', '/llms.txt', '/llms-full.txt',
                   '/api/posts.json', '/api/profile.json',
                   '/.well-known/agent.json', '/.well-known/ai.txt',
                   '/.well-known/security.txt',
                   '/feed.xml', '/sitemap.xml', '/robots.txt',
                   '/google1c46eeaf51fdfca4.html']
          for p in json.load(open('posts.json'))['posts']:
              paths.append(f"/blog/{p['slug']}/")
              paths.append('/' + p['image'])
          print('\n'.join(dict.fromkeys(paths)))
          PY
          echo "checking $(wc -l < /tmp/paths.txt) paths"

          fail=0
          while read -r path; do
            [ -n "$path" ] || continue
            # Retry, because a freshly pushed commit can take a moment to be
            # readable. A 404 that is cached hard is much worse than a slow pass.
            for attempt in 1 2 3 4 5; do
              hdr=$(curl -sS -m 30 -D - -o /dev/null "https://isarar.com${path}" | tr -d '\r')
              code=$(printf '%s' "$hdr" | awk 'NR==1{print $2}')
              [ "$code" = "200" ] && break
              sleep 6
            done
            mode=$(printf '%s' "$hdr" | awk '/^x-mode:/{print $2}')
            build=$(printf '%s' "$hdr" | awk '/^x-build:/{print $2}')
            printf '%-52s %s  mode=%-8s build=%s\n' "$path" "$code" "$mode" "$build"
            [ "$code" = "200" ] || fail=1
          done < /tmp/paths.txt

          if [ "$fail" != "0" ]; then
            echo
            echo "At least one path did not return 200."
            echo "If the file exists in this commit, the Worker has most likely cached"
            echo "a negative response for it. Pushing another commit changes the pinned"
            echo "sha and therefore the subrequest cache key, which clears it."
          fi
          exit $fail
